<!doctype html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Localidades · IoT Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen">
  <div id="nav"></div>
  <main class="max-w-7xl mx-auto px-4 py-6 space-y-4">
    <p class="text-sm text-slate-400">Saúde da rede por cômodo: dispositivos online em relação aos que o Home Assistant consegue medir. <span id="at" class="text-slate-500"></span></p>
    <div id="grid" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4"></div>
  </main>

  <script type="module">
    import { nav, loadDevices, esc, auto } from './ui.js';
    nav('localidades.html');
    const $ = id => document.getElementById(id);
    const chip = {
      ok: 'border-emerald-500/30 text-emerald-300 bg-emerald-500/10',
      unavailable: 'border-red-500/30 text-red-300 bg-red-500/10',
      partial: 'border-amber-500/30 text-amber-300 bg-amber-500/10',
      no_entities: 'border-slate-600 text-slate-400 bg-slate-700/30',
    };

    function render(ds) {
      const g = {};
      ds.forEach(d => (g[d.area] ??= []).push(d));
      $('grid').innerHTML = Object.entries(g).sort((a, b) => a[0].localeCompare(b[0])).map(([area, list]) => {
        const known = list.filter(d => d.status !== 'no_entities');
        const ok = known.filter(d => d.status === 'ok').length;
        const pct = known.length ? Math.round(ok / known.length * 100) : null;
        const bar = pct === null ? 'bg-slate-600' : pct >= 90 ? 'bg-emerald-500' : pct >= 60 ? 'bg-amber-500' : 'bg-red-500';
        return `<article class="bg-slate-800 border border-slate-700 rounded-xl p-5">
          <div class="flex justify-between items-baseline gap-2"><h2 class="font-semibold">${esc(area)}</h2><span class="text-sm text-slate-400">${pct === null ? 'sem dados' : pct + '% online'}</span></div>
          <div class="h-2 bg-slate-700 rounded mt-3 overflow-hidden"><div class="h-full ${bar}" style="width:${pct ?? 0}%"></div></div>
          <p class="text-xs text-slate-500 mt-2">${ok} online · ${known.length - ok} offline/parcial · ${list.length - known.length} sem estado</p>
          <div class="flex flex-wrap gap-1.5 mt-3">${list.map(d => `<span class="px-2 py-0.5 rounded text-xs border ${chip[d.status] || chip.no_entities}">${esc(d.name)}</span>`).join('')}</div>
        </article>`;
      }).join('') || '<p class="text-slate-500">Nenhum dispositivo encontrado.</p>';
    }

    auto(async () => {
      try {
        const r = await loadDevices();
        render(r.ds);
        $('at').textContent = '· atualizado às ' + r.at.toLocaleTimeString('pt-BR');
      } catch { /* toast já exibido */ }
    });
  </script>
</body>
</html>
