<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor IoT - Dispositivos Indisponíveis</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 md:p-8">
    <div class="max-w-5xl mx-auto">
        
        <!-- Cabeçalho do Painel -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 border-b border-slate-800 pb-6">
            <div>
                <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-white flex items-center gap-3">
                    <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse" id="connection-indicator"></span>
                    Monitor Home Assistant
                </h1>
                <p class="text-slate-400 text-sm mt-1">Gerenciamento em tempo real de entidades indisponíveis</p>
            </div>
            
            <div class="flex items-center gap-4">
                <!-- Contador de Offline -->
                <div class="bg-red-500/10 text-red-400 px-4 py-2 rounded-xl font-semibold border border-red-500/20 flex items-center gap-2 shadow-inner">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M13.477 14.89A6 6 0 015.11 6.524l8.367 8.368zm1.414-1.414L6.524 5.11a6 6 0 018.367 8.367zM18 10a8 8 0 11-16 0 8 8 0 0116 0z" clip-rule="evenodd" />
                    </svg>
                    <span>Offline: <strong id="count-offline" class="text-lg">0</strong></span>
                </div>

                <!-- Botão de Sincronização Manual -->
                <button onclick="fetchOfflineDevices()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-medium transition shadow-lg shadow-indigo-600/20 flex items-center gap-2 cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    Atualizar
                </button>
            </div>
        </header>

        <!-- Card Principal da Tabela -->
        <main class="bg-slate-800/80 backdrop-blur-md rounded-2xl p-6 shadow-2xl border border-slate-700/60">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-semibold text-slate-200">Dispositivos Fora do Ar / Indisponíveis</h2>
                <span id="last-update" class="text-xs text-slate-400">Última atualização: --:--:--</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400 text-sm uppercase tracking-wider">
                            <th class="py-3 px-4 font-semibold">Dispositivo</th>
                            <th class="py-3 px-4 font-semibold">Entidade (Entity ID)</th>
                            <th class="py-3 px-4 font-semibold">Status</th>
                        </tr>
                    </thead>
                    <tbody id="device-table-body" class="divide-y divide-slate-700/40">
                        <tr>
                            <td colspan="3" class="py-8 text-center text-slate-400">
                                Carregando dados da API...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
        
        <footer class="text-center mt-6 text-xs text-slate-500">
            ha-devices-api &bull; Integrado ao ambiente Docker / Portainer
        </footer>
    </div>

    <!-- Script de Integração com a API -->
    <script>
        async function fetchOfflineDevices() {
            const indicator = document.getElementById('connection-indicator');
            const tbody = document.getElementById('device-table-body');
            const countSpan = document.getElementById('count-offline');
            const lastUpdateSpan = document.getElementById('last-update');

            try {
                // Requisição assíncrona para a rota do FastAPI
                const response = await fetch('/api/devices/offline');
                
                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }

                const data = await response.json();

                // Atualiza indicador de conexão para verde (Online)
                indicator.className = "inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse";
                
                // Atualiza contador
                countSpan.textContent = data.total_offline ?? data.devices.length;
                
                // Limpa a tabela
                tbody.innerHTML = '';

                if (!data.devices || data.devices.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="3" class="py-8 text-center text-emerald-400 font-medium">
                                ✨ Tudo em ordem! Nenhum dispositivo offline no momento.
                            </td>
                        </tr>`;
                } else {
                    data.devices.forEach(device => {
                        const row = document.createElement('tr');
                        row.className = 'hover:bg-slate-700/30 transition-colors';
                        row.innerHTML = `
                            <td class="py-4 px-4 font-medium text-slate-200">${device.name || 'Desconhecido'}</td>
                            <td class="py-4 px-4 text-slate-400 font-mono text-xs">${device.entity_id}</td>
                            <td class="py-4 px-4">
                                <span class="bg-red-500/10 text-red-400 text-xs px-3 py-1 rounded-full border border-red-500/20 font-medium uppercase tracking-wide">
                                    ${device.status}
                                </span>
                            </td>
                        `;
                        tbody.appendChild(row);
                    });
                }

                // Atualiza o horário do último sync bem sucedido
                const now = new Date();
                lastUpdateSpan.textContent = `Última atualização: ${now.toLocaleTimeString()}`;

            } catch (error) {
                console.error('Falha ao comunicar com a API:', error);
                // Muda indicador de conexão para vermelho (Erro/Offline)
                indicator.className = "inline-block w-3 h-3 bg-red-500 rounded-full";
                
                tbody.innerHTML = `
                    <tr>
                        <td colspan="3" class="py-8 text-center text-red-400">
                            ⚠️ Erro ao conectar com a API FastAPI. Verifique se o container está rodando.
                        </td>
                    </tr>`;
            }
        }

        // Executa ao carregar a página
        fetchOfflineDevices();

        // Configura polling automático a cada 30 segundos
        setInterval(fetchOfflineDevices, 30000);
    </script>
</body>
</html>
