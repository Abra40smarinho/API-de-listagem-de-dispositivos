<!doctype html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Monitor Home Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: radial-gradient(1200px 500px at 50% -10%, #1e1b4b55, transparent), #0f172a; }
    thead th { position: sticky; top: 0; z-index: 1; }
    .scroll::-webkit-scrollbar { width: 8px; height: 8px }
    .scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 8px }
  </style>
</head>
<body class="text-slate-200 min-h-screen">
  <div id="nav"></div>
  <main class="max-w-[1400px] mx-auto px-4 py-4 space-y-4">
    <section id="metrics" class="grid grid-cols-2 md:grid-cols-5 gap-3"></section>

    <section class="bg-slate-800/60 border border-slate-700 rounded-xl overflow-hidden">
      <div class="p-3 flex flex-wrap gap-2 items-center border-b border-slate-700">
        <input id="q" type="search" placeholder="Buscar nome, modelo ou entidade…" class="flex-1 min-w-[12rem] bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500">
        <div id="seg" class="flex rounded-lg overflow-hidden border border-slate-700 text-xs"></div>
        <select id="integ" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-indigo-500"></select>
        <select id="area" class="hidden bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-indigo-500"></select>
        <button id="sync" class="bg-indigo-500 hover:bg-indigo-400 disabled:opacity-50 text-white text-sm font-medium rounded-lg px-3 py-1.5">↻ Sincronizar agora</button>
      </div>
      <div class="scroll overflow-auto max-h-[calc(100vh-16rem)] min-h-[12rem]">
        <table class="w-full text-xs">
          <thead class="text-[11px] uppercase tracking-wide text-slate-400">
            <tr class="bg-slate-900">
              <th class="px-3 py-2 text-left">Status</th>
              <th class="px-3 py-2 text-left">Dispositivo</th>
              <th class="px-3 py-2 text-left">Integração</th>
              <th class="px-3 py-2 text-left">Entidade (fora/total)</th>
              <th class="px-3 py-2 text-left hidden lg:table-cell">Tipo</th>
              <th class="px-3 py-2 text-left hidden md:table-cell">Cômodo</th>
              <th class="px-3 py-2 text-left hidden sm:table-cell" title="Desde a primeira vez que o painel viu o dispositivo offline">Offline há</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="foot" class="px-3 py-2 text-[11px] text-slate-500 border-t border-slate-700"></div>
    </section>
  </main>

  <script type="module">
    import { nav, loadDevices, isOff, visible, STATUS, esc, auto, ago, pref } from '/static/ui.js';
    nav('painel');
    const $ = id => document.getElementById(id);
    const MODES = [
      ['off', 'Indisponíveis', isOff],
      ['ok', 'Online', d => d.status === 'ok'],
      ['none', 'Sem estado', d => d.status === 'no_entities'],
      ['all', 'Todos', () => true],
    ];
    const rank = { unavailable: 0, partial: 1, no_entities: 2, ok: 3 };
    let ds = [], at = null, mode = 'off';
    const open = new Set();

    function select(el, label, counts, keep) {
      el.innerHTML = `<option value="">${label}</option>` + Object.entries(counts).sort().map(([k, c]) =>
        `<option value="${esc(k)}" ${k === keep ? 'selected' : ''}>${esc(k)} (${c})</option>`).join('');
    }

    function render() {
      const base = visible(ds);
      const n = f => base.filter(f).length;
      const hidden = ds.length - base.length;

      $('metrics').innerHTML = [
        ['Total de dispositivos', base.length, 'text-cyan-300', hidden ? `${hidden} demo oculto(s)` : ''],
        ['Online', n(d => d.status === 'ok'), 'text-emerald-400', ''],
        ['Indisponíveis', n(isOff), 'text-red-400', `${n(d => d.status === 'unavailable')} offline · ${n(d => d.status === 'partial')} parcial`],
        ['Sem estado', n(d => d.status === 'no_entities'), 'text-slate-300', 'sem entidades no HA'],
        ['Última sincronização', at ? at.toLocaleTimeString('pt-BR') : '–', 'text-indigo-300', 'automática a cada 30 s'],
      ].map(([l, v, c, s]) => `
        <div class="bg-slate-800/60 border border-slate-700 rounded-xl px-4 py-2.5">
          <p class="text-[11px] uppercase tracking-wide text-slate-400">${l}</p>
          <p class="text-2xl font-semibold leading-tight ${c}">${v}</p>
          <p class="text-[11px] text-slate-500 h-4">${s}</p>
        </div>`).join('');

      const pass = MODES.find(m => m[0] === mode)[2];
      $('seg').innerHTML = MODES.map(([k, l, f]) =>
        `<button data-m="${k}" class="px-3 py-1.5 ${k === mode ? 'bg-indigo-500 text-white' : 'bg-slate-900 text-slate-300 hover:bg-slate-700'}">${l} <span class="opacity-70">${n(f)}</span></button>`).join('');

      const byMode = base.filter(pass);
      const count = key => byMode.reduce((a, d) => (a[d[key]] = (a[d[key]] || 0) + 1, a), {});
      select($('integ'), 'Todas as integrações', count('integ'), $('integ').value);
      const areas = count('area');
      select($('area'), 'Todos os cômodos', areas, $('area').value);
      $('area').classList.toggle('hidden', Object.keys(areas).length < 2);

      const q = $('q').value.trim().toLowerCase(), ig = $('integ').value, ar = $('area').value;
      const rows = byMode
        .filter(d => (!ig || d.integ === ig) && (!ar || d.area === ar) &&
          (!q || `${d.name} ${d.model || ''} ${d.entities.join(' ')}`.toLowerCase().includes(q)))
        .sort((a, b) => rank[a.status] - rank[b.status] || a.integ.localeCompare(b.integ) || a.name.localeCompare(b.name));

      $('rows').innerHTML = rows.length ? rows.map(d => {
        const [label, txt, dot] = STATUS[d.status];
        const nb = d.bad.length, ne = d.entities.length;
        const detail = open.has(d.id) ? `<tr class="bg-slate-900/50"><td colspan="7" class="px-3 py-2">
            <div class="flex flex-wrap gap-1">${d.entities.length ? d.entities.map(e =>
              `<span class="px-1.5 py-0.5 rounded font-mono text-[11px] ${d.bad.includes(e) ? 'bg-red-500/15 text-red-300' : 'bg-slate-700/60 text-slate-400'}">${esc(e)}</span>`).join('') : '<span class="text-slate-500">Sem entidades no Home Assistant</span>'}</div>
            <p class="mt-1 text-[11px] text-slate-500">${esc(d.manufacturer || '—')} · ${esc(d.model || '—')} · ID ${esc(d.id)}</p></td></tr>` : '';
        return `<tr data-id="${esc(d.id)}" class="border-t border-slate-700/50 hover:bg-slate-700/30 cursor-pointer">
          <td class="px-3 py-1.5 whitespace-nowrap"><span class="inline-flex items-center gap-1.5 ${txt}"><span class="w-1.5 h-1.5 rounded-full ${dot} ${d.status === 'unavailable' ? 'animate-pulse' : ''}"></span>${label}</span></td>
          <td class="px-3 py-1.5"><span class="font-medium text-slate-100">${esc(d.name)}</span> <span class="hidden xl:inline text-slate-500">${esc(d.model || '')}</span></td>
          <td class="px-3 py-1.5"><span class="px-1.5 py-0.5 rounded bg-indigo-500/15 text-indigo-300">${esc(d.integ)}</span></td>
          <td class="px-3 py-1.5 font-mono text-cyan-300 max-w-[20rem] truncate">${nb ? esc(d.bad[0]) : '—'}${nb > 1 ? ` <span class="text-slate-500">+${nb - 1}</span>` : ''}${ne ? ` <span class="text-slate-500">(${nb}/${ne})</span>` : ''}</td>
          <td class="px-3 py-1.5 hidden lg:table-cell">${d.types.slice(0, 4).map(t => `<span class="mr-1 px-1 rounded bg-slate-700 text-slate-300">${esc(t)}</span>`).join('')}</td>
          <td class="px-3 py-1.5 hidden md:table-cell text-slate-400">${esc(d.area)}</td>
          <td class="px-3 py-1.5 hidden sm:table-cell text-slate-400 whitespace-nowrap">${d.since ? ago(d.since) : '—'}</td>
        </tr>${detail}`;
      }).join('') : '<tr><td colspan="7" class="px-3 py-10 text-center text-slate-500">Nenhum dispositivo neste filtro</td></tr>';

      $('foot').textContent = `Mostrando ${rows.length} de ${byMode.length} · clique numa linha para ver as entidades`;
    }

    async function sync() {
      $('sync').disabled = true;
      try { const r = await loadDevices(); ds = r.ds; at = r.at; render(); } catch { /* toast já exibido */ }
      $('sync').disabled = false;
    }

    $('q').oninput = render;
    $('integ').onchange = render;
    $('area').onchange = render;
    $('sync').onclick = sync;
    $('seg').onclick = e => { const b = e.target.closest('button'); if (b) { mode = b.dataset.m; render(); } };
    $('rows').onclick = e => {
      const tr = e.target.closest('tr[data-id]');
      if (!tr) return;
      open.has(tr.dataset.id) ? open.delete(tr.dataset.id) : open.add(tr.dataset.id);
      render();
    };
    window.addEventListener('prefs', render);
    auto(sync);
  </script>
</body>
</html>
