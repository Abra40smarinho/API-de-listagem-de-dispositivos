services:
  ha-devices-api:
    build: .
    container_name: ha-devices-api
    restart: unless-stopped
    ports:
      - "8088:8000"
    environment:
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
      - API_KEY=${API_KEY}

  ha-devices-notifier:
    build: .
    container_name: ha-devices-notifier
    restart: unless-stopped
    depends_on:
      - ha-devices-api
    command: ["python", "app/notifier.py"]
    environment:
      - API_URL=http://ha-devices-api:8000/devices/offline
      - API_KEY=${API_KEY}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - INTERVALO_SEGUNDOS=3600  # Roda a cada 1 hora (ajuste se preferir)
