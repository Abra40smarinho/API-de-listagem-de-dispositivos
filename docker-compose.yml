services:
  ha-devices-api:
    build: .
    container_name: ha-devices-api
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      HA_URL: ${HA_URL:?defina HA_URL}
      HA_TOKEN: ${HA_TOKEN:?defina HA_TOKEN}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
