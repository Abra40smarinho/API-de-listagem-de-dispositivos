services:
  ha-devices-api:
    build: .
    container_name: ha-devices-api
    restart: unless-stopped
    ports:
      - "8088:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HA_URL: ${HA_URL:-ws://host.docker.internal:8123/api/websocket}
      HA_TOKEN: ${HA_TOKEN}
