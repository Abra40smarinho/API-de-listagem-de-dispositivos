services:
  ha-devices-api:
    build: .
    container_name: ha-devices-api
    restart: unless-stopped
    ports:
      - "8088:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HA_TOKEN=${HA_TOKEN}
      - HA_URL=${HA_URL:-ws://host.docker.internal:8123/api/websocket}
      - API_KEY=${API_KEY}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}       # <--- ADICIONE ESTA LINHA AQUI
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}   # <--- ADICIONE ESTA LINHA AQUI

  ha-devices-notifier:
    build: .
    container_name: ha-devices-notifier
    restart: unless-stopped
    depends_on:
      - ha-devices-api
    volumes:
      - ./dados_banco:/app/data
    command: ["python", "app/notifier.py"]
    environment:
      - API_URL=http://ha-devices-api:8000/devices/offline
      - API_KEY=${API_KEY}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - DB_PATH=/app/data/tuya_historico.db
