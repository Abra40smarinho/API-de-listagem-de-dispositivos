version: '3.8'

services:
  ha-devices-api:
    build: .
    container_name: ha-devices-api
    restart: unless-stopped
    ports:
      - "8088:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 1. Adicionado aqui: Mapeia a pasta config do Home Assistant em modo somente leitura
      - /caminho/no/seu/host/config:/config:ro
      # 2. Se o seu notifier grava o tuya_historico.db em um volume compartilhado, 
      # garanta que a API também enxergue esse volume se for ler dele:
      - dados_db_totais:/app/data
    environment:
      - HA_TOKEN=${HA_TOKEN}
      - HA_URL=${HA_URL:-ws://host.docker.internal:8123/api/websocket}
      - API_KEY=${API_KEY}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - HA_DB_PATH=/config/home-assistant_v2.db

  ha-devices-notifier:
    build: .
    container_name: ha-devices-notifier
    restart: unless-stopped
    depends_on:
      - ha-devices-api
    volumes:
      - dados_db_totais:/app/data
    command: ["python", "app/notifier.py"]
    environment:
      - API_URL=http://ha-devices-api:8000/devices/offline
      - API_KEY=${API_KEY}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - DB_PATH=/app/data/tuya_historico.db

volumes:
  dados_db_totais:
